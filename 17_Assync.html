<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assync</title>
</head>
<style>
  body {
    box-sizing: border-box;
  }

  .cont {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
  }
</style>

<body>
  <div class="cont">
    <h1 id="clock">00:00:00</h1>
    <span>
      <button id="start">Start</button>
      <button id="stop">Stop</button>
    </span>
    <br>
    <span>
      <button id="ChangeColor">Start Changes</button>
      <button id="RemoveColor">Stop Changes</button>
    </span>

  </div>
</body>
<script>
  // const chnageMe = setTimeout(() => {
  //   console.log("Deepak");
  //   document.getElementsByTagName('h1')[0].innerHTML = "Hello Deep";
  // }, 2000);

  // document.querySelector('#stop').addEventListener('click', () => {
  //   clearTimeout(chnageMe);
  //   console.log('Stopped');
  // })

  //setInterval------------------------------

  const clock = document.querySelector('#clock');
  let sayDate = null;

  const start = document.querySelector('#start');
  start.addEventListener('click', () => {
    if (sayDate === null) {
      sayDate = setInterval(() => {
        const date = new Date();
        clock.innerHTML = date.toLocaleTimeString();
      }, 1000)
    }
    console.log('started');
  })

  const stop = document.querySelector('#stop');
  stop.addEventListener('click', () => {
    if (sayDate != null) {
      clearInterval(sayDate);
      sayDate = null;
      console.log('Stopped');
    }
  });

  //Changing color---------------------------
  const body = document.body;

  // START
  const ChangeColor = document.querySelector('#ChangeColor');
  let intervalId = null;

  const startChanging = () => {
    if (intervalId === null) {
      intervalId = setInterval(() => {
        body.style.backgroundColor = randomColor();
      }, 1000);
    }
  };

  ChangeColor.addEventListener('click', startChanging);

  // STOP
  const RemoveColor = document.querySelector('#RemoveColor');

  const stopChanging = () => {
    clearInterval(intervalId);
    intervalId = null;
  };

  RemoveColor.addEventListener('click', stopChanging);

  //Random-Color
  const randomColor = () => {
    const hexVal = '0123456789ABCDEF';
    let color = '#'
    for (let i = 0; i < 6; i++) {
      color += hexVal[Math.floor(Math.random() * 16)];
    }
    return color;
  };

  console.log(randomColor());


</script>

</html>
