<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API</title>
</head>
<style>
  main {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 97vh;
  }

  .container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    width: 320px;
    padding: 20px;
    border-radius: 20px;

    background: rgba(27, 12, 12, 0.15);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);

    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    color: #3d0c0c;
  }


  .imgs {
    width: 300px;
    height: 300px;
    border-radius: 20px;
    margin-bottom: 20px;
  }
</style>

<body>
  <main>
    <div class="container">
      <h2 class="h1">hey</h2>
      <img class="imgs" src="" alt="">
    </div>
  </main>
</body>
<script>
  const reruestURl = 'https://api.github.com/users/Deepak-codes-ai';
  const xhr = new XMLHttpRequest();
  xhr.open('GET', reruestURl);
  xhr.onreadystatechange = function () {
    console.log(xhr.readyState);
    if (xhr.readyState === 4) {
      const data = JSON.parse(this.responseText)
      console.log(data);
      console.log('followers : ', data.followers);
      let h1 = document.getElementsByClassName('h1')[0];
      h1.innerText = `${data.name}`;
      let img = document.getElementsByClassName('imgs')[0];
      img.src = data.avatar_url;
    }
  }

  xhr.send();
</script>

</html>
