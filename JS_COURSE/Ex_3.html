<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Clock</title>
</head>
<style>
  body {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .container {
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    color: aliceblue;
  }

  #clock {
    font-size: 30px;
    background: rgb(231, 225, 223);
    padding: 20px 50px;
    border-radius: 10px;
    color: black;
  }
</style>

<body>
  <div class="container">
    <div id="banner"><span>You local Time</span></div>
    <div id="clock">00:00:00</div>
  </div>
</body>
<script>
  const clock = document.querySelector('#clock');


  setInterval(() => {
    const date = new Date();
    clock.innerHTML = date.toLocaleTimeString()
  }, 1000);

</script>

</html>
